[project]
name = "prodml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tamer-elkoT", email = "tamerelkottrinx1.4@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "mlflow>=3.16.1",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.54.0",
    "xgboost>=3.2.0",
]


[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[project.scripts]
prodml-train = "prodml.train:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
